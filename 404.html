<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página não encontrada | Connect Digital</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Connect Digital" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--navy-deep);
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,180,255,0.06) 0%, transparent 65%);
      border-radius: 50%;
      pointer-events: none;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #00B4FF, rgba(0,180,255,0.3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--white);
      margin-bottom: 1rem;
    }
    .error-desc {
      font-size: 1.0625rem;
      color: var(--white-60);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="error-page" role="main">
    <div class="error-code" aria-label="Erro 404">404</div>
    <h1 class="error-title">Página não encontrada</h1>
    <p class="error-desc">Parece que você tentou acessar algo que não existe por aqui. Mas não se preocupe — ainda podemos conectar você ao lugar certo.</p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary" id="errorHomeBtn">Voltar para Home</a>
      <a href="contato.html" class="btn btn-ghost" id="errorContactBtn">Falar Conosco</a>
    </div>
  </main>
</body>
</html>
